<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>HubKita</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --v1: #8b5cf6;
    --v2: #7c3aed;
    --v3: #6d28d9;
    --bg: #faf8ff;
    --surface: #fff;
    --surface-2: #f5f3ff;
    --text: #1a1533;
    --text-2: #5d5478;
    --text-3: #9b95ab;
    --border: #ece9f5;
    --divider: #f5f3ff;
    --teal: #14b8a6;
    --rose: #f43f5e;
    --emerald: #10b981;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
    --ff: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  html.dark {
    --bg: #0a0617;
    --surface: #1a1030;
    --surface-2: #251740;
    --text: #f5f3ff;
    --text-2: #b8aed1;
    --text-3: #7a6f97;
    --border: #2a1a4a;
    --divider: #1f1338;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--ff);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button, input, textarea {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    outline: none;
    border: none;
    background: none;
    cursor: pointer;
    -webkit-appearance: none;
    border-radius: 0;
  }

  button:disabled { cursor: not-allowed; opacity: .5; }
  .hide { display: none !important; }
  input::placeholder, textarea::placeholder { color: var(--text-3); }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  svg { display: block; flex-shrink: 0; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  #boot {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: radial-gradient(circle at 30% 20%, #2d1b5e 0%, #0a0617 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    transition: opacity .5s;
  }
  #boot.out { opacity: 0; pointer-events: none; }

  .boot-mark {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 60px rgba(139, 92, 246, .5);
  }
  .boot-mark svg { width: 40px; height: 40px; stroke: #fff; stroke-width: 2.5; }
  .boot-name { color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .boot-status { color: rgba(255, 255, 255, .5); font-size: 13px; }
  .boot-spin {
    width: 24px;
    height: 24px;
    border: 3px solid rgba(255, 255, 255, .1);
    border-top-color: #8b5cf6;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  #toasts {
    position: fixed;
    top: calc(16px + var(--safe-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    width: calc(100% - 32px);
    max-width: 400px;
  }
  .toast {
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .3);
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideDown .3s cubic-bezier(.16, 1, .3, 1);
    backdrop-filter: blur(20px);
    color: #fff;
  }
  .toast.ok { background: rgba(16, 185, 129, .95); }
  .toast.err { background: rgba(244, 63, 94, .95); }
  .toast.inf { background: rgba(139, 92, 246, .95); }
  .toast svg { width: 18px; height: 18px; }

  #auth {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: radial-gradient(circle at 30% 20%, #2d1b5e 0%, #0a0617 70%);
    overflow-y: auto;
    padding: 32px 20px;
    padding-top: calc(32px + var(--safe-top));
  }
  .auth-brand { text-align: center; margin: 32px 0; }
  .auth-mark {
    width: 88px;
    height: 88px;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 20px 60px rgba(139, 92, 246, .5);
  }
  .auth-mark svg { width: 44px; height: 44px; stroke: #fff; stroke-width: 2.5; }
  .auth-title { color: #fff; font-size: 32px; font-weight: 800; letter-spacing: -1.2px; }
  .auth-sub { color: rgba(255, 255, 255, .5); font-size: 14px; margin-top: 6px; }
  .auth-card {
    background: var(--surface);
    border-radius: 24px;
    padding: 26px;
    max-width: 420px;
    width: 100%;
    margin: 0 auto;
    box-shadow: 0 32px 80px rgba(0, 0, 0, .4);
    animation: slideUp .5s cubic-bezier(.16, 1, .3, 1);
  }
  .step-title { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -.4px; margin-bottom: 6px; }
  .step-sub { font-size: 13.5px; color: var(--text-2); margin-bottom: 22px; line-height: 1.55; }
  .field { margin-bottom: 14px; }
  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-3);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: .8px;
  }
  .field-input {
    width: 100%;
    padding: 15px 16px;
    border-radius: 14px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 15px;
    border: 2px solid transparent;
    transition: all .2s;
    font-weight: 500;
  }
  .field-input:focus {
    border-color: var(--v1);
    background: var(--surface);
    box-shadow: 0 0 0 4px rgba(139, 92, 246, .1);
  }
  .field-input.otp {
    letter-spacing: 12px;
    font-size: 24px;
    text-align: center;
    font-weight: 800;
    padding-left: 20px;
  }
  .phone-row { display: flex; gap: 8px; }
  .phone-cc {
    padding: 15px 14px;
    background: var(--surface-2);
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    color: var(--v2);
    display: flex;
    align-items: center;
  }
  .btn {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary {
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: #fff;
    box-shadow: 0 8px 24px rgba(139, 92, 246, .4);
  }
  .btn-secondary { background: var(--surface-2); color: var(--text-2); margin-top: 10px; }
  .feedback {
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
    line-height: 1.5;
  }
  .feedback.on { display: block; }
  .feedback.err { background: rgba(244, 63, 94, .1); color: #be123c; border-left: 3px solid var(--rose); }
  .feedback.ok { background: rgba(16, 185, 129, .1); color: #047857; border-left: 3px solid var(--emerald); }
  .feedback.info { background: rgba(139, 92, 246, .1); color: #5b21b6; border-left: 3px solid var(--v1); }
  html.dark .feedback.err { color: #fda4af; }
  html.dark .feedback.ok { color: #6ee7b7; }
  html.dark .feedback.info { color: #c4b5fd; }

  #app { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
  #app.on { display: flex; }

  .hdr {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    padding-top: calc(14px + var(--safe-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    z-index: 20;
  }
  .hdr-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .hdr-mark {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(139, 92, 246, .3);
  }
  .hdr-mark svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.5; }
  .hdr-info { min-width: 0; }
  .hdr-title { font-size: 16px; font-weight: 800; color: var(--text); letter-spacing: -.3px; line-height: 1.2; }
  .hdr-sub {
    font-size: 11.5px;
    color: var(--text-3);
    font-weight: 500;
    line-height: 1.2;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hdr-actions { display: flex; gap: 4px; align-items: center; }
  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
    transition: all .15s;
  }
  .icon-btn:active { background: var(--surface-2); transform: scale(.94); }
  .icon-btn svg { width: 20px; height: 20px; }
  .hdr-av {
    width: 34px;
    height: 34px;
    border-radius: 11px;
    object-fit: cover;
    background: var(--surface-2);
    border: 2px solid var(--border);
  }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 14px 16px 8px;
    flex-shrink: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--border);
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
    cursor: pointer;
  }
  .tab:active { transform: scale(.97); }
  .tab.on {
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 6px 18px rgba(139, 92, 246, .3);
  }
  .tab svg { width: 16px; height: 16px; }
  .tab-badge {
    background: rgba(0, 0, 0, .06);
    color: inherit;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 99px;
    min-width: 20px;
    text-align: center;
  }
  .tab.on .tab-badge { background: rgba(255, 255, 255, .25); }
  .tab-badge.rose { background: var(--rose); color: #fff; }

  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
    padding: 8px 0 24px;
  }

  .section { padding: 12px 16px; }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding: 0 4px;
  }
  .section-title {
    font-size: 11.5px;
    font-weight: 800;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title svg { width: 14px; height: 14px; }
  .section-count { font-size: 12px; color: var(--text-3); font-weight: 700; }

  .card {
    background: var(--surface);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    transition: all .2s;
    position: relative;
    overflow: hidden;
  }
  .card:active { transform: scale(.997); }
  .card.urgent { border-color: rgba(244, 63, 94, .25); }
  .card.urgent::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #f43f5e, #be123c);
  }
  .card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .card-av {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    object-fit: cover;
    background: var(--surface-2);
    flex-shrink: 0;
    border: 2px solid var(--border);
  }
  .card-meta { flex: 1; min-width: 0; }
  .card-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .card-badge {
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .badge-urgent { background: rgba(244, 63, 94, .12); color: var(--rose); }
  .badge-admin { background: rgba(139, 92, 246, .12); color: var(--v2); }
  html.dark .badge-urgent { background: rgba(244, 63, 94, .2); color: #fda4af; }
  html.dark .badge-admin { background: rgba(139, 92, 246, .2); color: #c4b5fd; }
  .card-time { font-size: 11.5px; color: var(--text-3); }
  .card-title {
    font-size: 16.5px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.35;
    letter-spacing: -.3px;
  }
  .card-text {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text-2);
    white-space: pre-wrap;
    word-wrap: break-word;
    margin-bottom: 14px;
  }
  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid var(--divider);
    flex-wrap: wrap;
  }
  .card-stats { display: flex; gap: 12px; font-size: 12px; color: var(--text-3); font-weight: 600; }
  .card-stat { display: flex; align-items: center; gap: 5px; }
  .card-stat svg { width: 14px; height: 14px; }
  .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-act {
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 700;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn-act:active { transform: scale(.95); }
  .btn-act svg { width: 14px; height: 14px; }
  .btn-act.primary {
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: #fff;
    box-shadow: 0 4px 12px rgba(139, 92, 246, .3);
  }
  .btn-act.success { background: rgba(16, 185, 129, .1); color: var(--emerald); }
  .btn-act.ghost { background: var(--surface-2); color: var(--text-2); }

  .empty { padding: 64px 24px; text-align: center; }
  .empty-ic {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    color: var(--v1);
  }
  .empty-ic svg { width: 40px; height: 40px; }
  .empty-title { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 6px; letter-spacing: -.3px; }
  .empty-text {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-2);
    max-width: 320px;
    margin: 0 auto;
  }

  .room { display: flex; flex-direction: column; height: 100%; background: var(--bg); }
  .room-hdr {
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    padding-top: calc(12px + var(--safe-top));
  }
  .room-back {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
  }
  .room-back:active { background: var(--surface-2); }
  .room-av {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    object-fit: cover;
    background: var(--surface-2);
    border: 2px solid var(--border);
  }
  .room-info { flex: 1; min-width: 0; }
  .room-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .room-status {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 1px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); display: inline-block; }
  .msgs {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .day-chip {
    align-self: center;
    background: var(--surface);
    color: var(--text-2);
    font-size: 11.5px;
    padding: 5px 14px;
    border-radius: 99px;
    margin: 10px 0;
    font-weight: 700;
    border: 1px solid var(--border);
  }
  .bwrap {
    position: relative;
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: msgIn .25s;
  }
  .bwrap.me { align-self: flex-end; align-items: flex-end; }
  .bwrap.other { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.4;
    position: relative;
    word-wrap: break-word;
    white-space: pre-wrap;
    display: inline-block;
    max-width: 100%;
    cursor: pointer;
  }
  .bwrap.me .bubble {
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: #fff;
    border-bottom-right-radius: 5px;
    box-shadow: 0 4px 12px rgba(139, 92, 246, .25);
  }
  .bwrap.other .bubble {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
  }
  .bwrap.me .bubble::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: -6px;
    width: 0;
    height: 0;
    border: 7px solid transparent;
    border-left-color: #6d28d9;
    border-top: 0;
    border-right: 0;
    border-bottom-width: 5px;
  }
  .bwrap.other .bubble::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: -6px;
    width: 0;
    height: 0;
    border: 7px solid transparent;
    border-right-color: var(--surface);
    border-top: 0;
    border-left: 0;
    border-bottom-width: 5px;
  }
  .b-text { padding-bottom: 16px; }
  .b-meta {
    font-size: 10.5px;
    color: rgba(255, 255, 255, .7);
    position: absolute;
    bottom: 4px;
    right: 10px;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .bwrap.other .b-meta { color: var(--text-3); }
  .b-meta svg { width: 13px; height: 13px; stroke-width: 2.5; }
  .b-menu {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: none;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 3px;
    border-radius: 99px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .1);
    z-index: 10;
  }
  .bwrap.me .b-menu { right: calc(100% + 6px); }
  .bwrap.other .b-menu { left: calc(100% + 6px); }
  .bwrap.menu-open .b-menu { display: flex; }
  .b-menu button {
    padding: 6px;
    border-radius: 99px;
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .b-menu button.del { color: var(--rose); }
  .b-menu button svg { width: 16px; height: 16px; }

  .input-bar {
    padding: 10px 12px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
    padding-bottom: calc(10px + var(--safe-bot));
  }
  .in-attach {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);

  const palette = ['8b5cf6', '7c3aed', 'ec4899', 'f43f5e', 'f59e0b', '10b981', '06b6d4', '3b82f6'];
  const s = name || '?';
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h |= 0;
  }
  const color = palette[Math.abs(h) % palette.length];
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(s)}&background=${color}&color=fff&size=200&bold=true&format=png`;
};

const timeAgo = (ts) => {
  const diff = Date.now() - new Date(ts).getTime();
  const s = Math.floor(diff / 1000);
  if (s < 30) return 'baru saja';
  if (s < 60) return `${s}d`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}j`;
  const d = Math.floor(h / 24);
  if (d < 7) return `${d}h`;
  return new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
};

// ─── sound ─────────────────────────────────────────────

const Sound = {
  init() {
    try {
      state.audio = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      // WebAudio not available — silent fallback
    }
  },
  play(kind) {
    if (!state.audio) return;
    if (state.audio.state === 'suspended') state.audio.resume();
    const now = state.audio.currentTime;
    const osc = state.audio.createOscillator();
    const gain = state.audio.createGain();
    osc.connect(gain);
    gain.connect(state.audio.destination);
    if (kind === 'send') {
      osc.frequency.setValueAtTime(700, now);
      osc.frequency.exponentialRampToValueAtTime(950, now + 0.08);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      osc.start(now);
      osc.stop(now + 0.13);
    } else {
      osc.frequency.setValueAtTime(950, now);
      osc.frequency.exponentialRampToValueAtTime(700, now + 0.12);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.start(now);
      osc.stop(now + 0.18);
    }
  }
};

  toggle() {

    $('btn-verify').addEventListener('click', () => this.verifyOtp());
    $('btn-back').addEventListener('click', () => this.reset());
    $('btn-name').addEventListener('click', () => this.saveName());

    $('phone-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') this.sendOtp();
    });
    $('otp-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') this.verifyOtp();
    });
    $('name-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') this.saveName();
    });
  },

  async sendOtp() {
    const raw = $('phone-input').value.trim().replace(/\D/g, '');
    if (raw.length < 8) return setFeedback('fb1', 'Nomor minimal 8 digit', 'err');

    const cleaned = raw.charAt(0) === '0' ? raw.substring(1) : raw;
    this.pendingPhone = `62${cleaned}`;

    const btn = $('btn-send');
    btn.disabled = true;
    btn.textContent = 'Mengirim...';

    try {
      const { error } = await state.sb.auth.signInWithOtp({ phone: `+${this.pendingPhone}` });
      if (error) throw error;
      $('phone-display').textContent = `+${this.pendingPhone}`;
      hide('step1');
      show('step2');
      setTimeout(() => $('otp-input').focus(), 250);
      setFeedback('fb2', 'Masukkan kode 6 digit', 'info');
    } catch (e) {
      setFeedback('fb1', e.message || 'Gagal mengirim kode', 'err');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Kirim Kode';
    }
  },

  async verifyOtp() {
    const code = $('otp-input').value.trim();
    if (code.length !== 6) return setFeedback('fb2', 'Kode harus 6 digit', 'err');

    const btn = $('btn-verify');
    btn.disabled = true;
    btn.textContent = 'Memverifikasi...';

    try {
      const { error } = await state.sb.auth.verifyOtp({
        phone: `+${this.pendingPhone}`,
        token: code,
        type: 'sms'
      });
      if (error) throw error;
      // onAuthStateChange handles the rest
    } catch (e) {
      setFeedback('fb2', e.message || 'Kode salah', 'err');
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><polyline points="20 6 9 17 4 12"/></svg> Verifikasi';
    }
  },

  reset() {
    hide('step2');
    hide('step3');
    show('step1');
    clearFeedback('fb1', 'fb2', 'fb3');
    $('phone-input').value = '';
    $('otp-input').value = '';
  },

  async saveName() {
    const name = $('name-input').value.trim();
    if (name.length < 2) return setFeedback('fb3', 'Nama minimal 2 karakter', 'err');

    const btn = $('btn-name');
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    try {
      const payload = {
        id: state.user.id,
        name,
        phone: state.user.phone || '',
        email: state.user.email || '',
        avatar: avatarFor(name),
        bio: 'Pengguna HubKita',
        role: 'member',
        status: 'online',
        last_seen: new Date().toISOString()
      };

      const { error: upErr } = await state.sb.from('profiles').upsert(payload, { onConflict: 'id' });
      if (upErr) throw upErr;

      const { data, error: selErr } = await state.sb.from('profiles').select('*').eq('id', state.user.id).single();
      if (selErr) throw selErr;

      state.profile = data;
      enterApp();
      toast(`Selamat datang, ${name.split(' ')[0]}`, 'ok');
    } catch (e) {
      setFeedback('fb3', e.message || 'Gagal menyimpan', 'err');
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><polyline points="20 6 9 17 4 12"/></svg> Mulai';
    }
  }
};

// ─── navigation ────────────────────────────────────────

const nav = {
  go(tab) {
    state.tab = tab;
    document.querySelectorAll('.tab').forEach((el) => {
      el.classList.toggle('on', el.dataset.tab === tab);
    });
    $('fab').classList.toggle('hide', tab !== 'feed');
    if (state.activeChat) return;
    this.render();
  },

  render() {
    if (state.tab === 'feed') feedView.render();
    else if (state.tab === 'urgent') urgentView.render();
    else if (state.tab === 'chats') chatsView.render();
  }
};

// ─── feed ──────────────────────────────────────────────

const feedView = {
  render() {
    const content = $('content');

    if (!state.feed.length) {
      content.innerHTML = `
        <div class="empty">
          <div class="empty-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
          </div>
          <div class="empty-title">Belum ada pengumuman</div>
          <div class="empty-text">Klik tombol + di kanan bawah untuk membuat pengumuman pertama.</div>
        </div>`;
      return;
    }

    const announcements = state.feed.filter((m) => m.priority === 'announcement' || m.is_pinned);
    const updates = state.feed.filter((m) => m.priority !== 'announcement' && !m.is_pinned);

    let html = '<div class="section">';

    if (announcements.length) {
      html += `<div class="section-head"><div class="section-title">PENGUMUMAN</div><div class="section-count">${announcements.length}</div></div>`;
      html += announcements.map((m) => this.card(m, true)).join('');
    }
    if (updates.length) {
      html += `<div class="section-head" style="margin-top:24px"><div class="section-title">UPDATE TIM</div><div class="section-count">${updates.length}</div></div>`;
      html += updates.map((m) => this.card(m, false)).join('');
    }

    html += '</div>';
    content.innerHTML = html;
  },

  card(m, isAnnouncement) {
    const urgent = m.priority === 'urgent';
    const isRead = m.reads?.includes(state.user.id);
    const cls = `card${urgent ? ' urgent' : ''}`;
    const avatar = m.author_avatar || avatarFor(m.author_name || 'U');

    let badge = '';
    if (isAnnouncement) badge = '<span class="card-badge badge-admin">PENGUMUMAN</span>';
    else if (urgent) badge = '<span class="card-badge badge-urgent">PENTING</span>';

    const canDelete = state.profile.role === 'admin' || m.sender_id === state.user.id;

    return `
      <div class="${cls}">
        <div class="card-head">
          <img class="card-av" src="${escapeHtml(avatar)}" onerror="this.src='${avatarFor(m.author_name)}'">
          <div class="card-meta">
            <div class="card-name">${escapeHtml(m.author_name || 'Admin')} ${badge}</div>
            <div class="card-time">${fmtDate(m.created_at)}</div>
          </div>
        </div>
        ${m.title ? `<div class="card-title">${escapeHtml(m.title)}</div>` : ''}
        <div class="card-text">${escapeHtml(m.content)}</div>
        <div class="card-foot">
          <div class="card-stats">
            <div class="card-stat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              ${(m.reads?.length) || 0} dibaca
            </div>
          </div>
          <div class="card-actions">
            ${canDelete ? `<button class="btn-act ghost" data-action="delete-message" data-id="${m.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg></button>` : ''}
            ${isRead
              ? '<span class="btn-act success">✓ Dibaca</span>'
              : `<button class="btn-act primary" data-action="mark-read" data-id="${m.id}">Tandai Dibaca</button>`}
          </div>
        </div>
      </div>`;
  },

  async markRead(id) {
    try {
      const m = state.feed.find((x) => x.id === id);
      if (!m) return;
      const reads = m.reads || [];
      if (reads.includes(state.user.id)) return;
      reads.push(state.user.id);

      const { error } = await state.sb.from('messages').update({ reads }).eq('id', id);
      if (error) throw error;

      m.reads = reads;
      this.render();
      app.syncBadges();
      toast('Ditandai dibaca', 'ok');
    } catch (e) {
      toast(`Gagal: ${e.message}`, 'err');
    }
  },

  confirmDelete(id) {
    modal.confirm({
      title: 'Hapus pengumuman?',
      text: 'Tindakan ini tidak dapat dibatalkan.',
      confirmLabel: 'Hapus',
      danger: true,
      onConfirm: async () => {
        try {
          const { error } = await state.sb.from('messages').delete().eq('id', id);
          if (error) throw error;

          state.feed = state.feed.filter((x) => x.id !== id);
          state.urgent = state.urgent.filter((x) => x.id !== id);
          nav.render();
          app.syncBadges();
          toast('Dihapus', 'ok');
        } catch (e) {
          toast(`Gagal: ${e.message}`, 'err');
        }
      }
    });
  }
};

// ─── room (chat view) ──────────────────────────────────

const roomView = {
  async open(uid) {
    const peer = state.profiles.find((x) => x.id === uid);
    if (!peer) return;

    state.activeChat = peer;
    state.unread[peer.id] = 0;
    app.syncBadges();

    const online = peer.status === 'online';

    $('content').innerHTML = `
      <div class="room">
        <div class="room-hdr">
          <button class="room-back" data-action="close-room">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <img class="room-av" src="${escapeHtml(peer.avatar || avatarFor(peer.name))}" onerror="this.src='${avatarFor(peer.name)}'">
          <div class="room-info">
            <div class="room-name">${escapeHtml(peer.name)}</div>
            <div class="room-status" id="room-status">
              ${online ? '<span class="dot"></span>Online' : `Terakhir dilihat ${timeAgo(peer.last_seen || Date.now())}`}
            </div>
          </div>
        </div>
        <div class="msgs" id="msgs"></div>
        <div class="input-bar">
          <button class="in-attach" data-action="open-attach">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <div class="in-wrap">
            <textarea class="in-field" id="chat-input" placeholder="Ketik pesan..." rows="1"></textarea>
          </div>
          <button class="send-btn" data-action="send-message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>`;

    $('hdr-title').textContent = peer.name;
    $('hdr-sub').textContent = online ? 'Online' : `Terakhir dilihat ${timeAgo(peer.last_seen || Date.now())}`;
    $('fab').classList.add('hide');

    await this.loadMessages();
    setTimeout(() => $('chat-input')?.focus(), 200);
  },

  close() {
    state.activeChat = null;
    nav.go('chats');
  },

  async loadMessages() {
    const box = $('msgs');
    if (!box) return;
    box.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-3);font-size:13px">Memuat...</div>';

    const { user } = state;
    const peerId = state.activeChat.id;

    try {
      const { data, error } = await state.sb
        .from('messages')
        .select('*')
        .or(`and(sender_id.eq.${user.id},receiver_id.eq.${peerId}),and(sender_id.eq.${peerId},receiver_id.eq.${user.id})`)
        .order('created_at', { ascending: true })
        .limit(200);

      if (error) throw error;

      if (!data?.length) {
        box.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-3);font-size:13.5px">Belum ada pesan. Ketik "Halo!" untuk memulai.</div>';
        return;
      }

      let html = '';
      let lastDay = '';
      for (const m of data) {
        const day = new Date(m.created_at).toDateString();
        if (day !== lastDay) {
          lastDay = day;
          html += `<div class="day-chip">${dayLabel(m.created_at)}</div>`;
        }
        html += this.bubble(m);
      }
      box.innerHTML = html;
      setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
    } catch (e) {
      box.innerHTML = `<div style="text-align:center;padding:24px;color:var(--rose);font-size:13px">Error: ${escapeHtml(e.message)}</div>`;
    }
  },

  bubble(m) {
    const mine = m.sender_id === state.user.id;
    const cls = mine ? 'me' : 'other';
    const check = mine
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
      : '';
    const content = m.content
      ? `<div class="b-text">${escapeHtml(m.content)}</div>`
      : '<div class="b-text">[Media]</div>';

    return `
      <div class="bwrap ${cls}" data-id="${m.id}">
        <div class="b-menu">
          <button class="del" data-action="delete-chat-message" data-id="${m.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
        <div class="bubble">
          ${content}
          <div class="b-meta">${timeShort(m.created_at)}${check}</div>
        </div>
      </div>`;
  },

  confirmDelete(id) {
    modal.confirm({
      title: 'Hapus pesan?',
      text: 'Pesan akan dihapus untuk semua orang.',
      confirmLabel: 'Hapus',
      danger: true,
      onConfirm: async () => {
        try {
          const { error } = await state.sb.from('messages').delete().eq('id', id);
          if (error) throw error;
          const el = document.querySelector(`[data-id="${id}"]`);
          if (el) {
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 200);
          }
          toast('Pesan dihapus', 'ok');
        } catch (e) {
          toast(`Gagal: ${e.message}`, 'err');
        }
      }
    });
  },

  openAttach() {
    const existing = document.querySelector('.attach-menu');
    if (existing) return existing.remove();

    const menu = document.createElement('div');
    menu.className = 'attach-menu';
    menu.innerHTML = `
      <div class="att-item" data-pick="image/*">
        <div class="att-ic foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>
        <div class="att-lbl">Foto</div>
      </div>
      <div class="att-item" data-pick="video/*">
        <div class="att-ic video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
        <div class="att-lbl">Video</div>
      </div>
      <div class="att-item" data-pick="*">
        <div class="att-ic file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg></div>
        <div class="att-lbl">File</div>
      </div>`;

    document.querySelector('.room').appendChild(menu);

    menu.querySelectorAll('[data-pick]').forEach((el) => {
      el.addEventListener('click', () => {
        this.pickFile(el.dataset.pick);
        menu.remove();
      });
    });

    setTimeout(() => {
      document.addEventListener('click', () => menu.remove(), { once: true });
    }, 10);
  },

  pickFile(accept) {
    const input = $('file-input');
    input.accept = accept;
    input.click();
  },

  async send() {
    const input = $('chat-input');
    const content = input.value.trim();
    if (!content || !state.activeChat) return;

    input.value = '';
    input.style.height = 'auto';
    Sound.play('send');

    const temp = {
      id: `t_${Date.now()}`,
      sender_id: state.user.id,
      receiver_id: state.activeChat.id,
      content,
      created_at: new Date().toISOString()
    };

    const box = $('msgs');
    if (box.querySelector('div[style*="Belum ada pesan"]')) box.innerHTML = '';
    box.insertAdjacentHTML('beforeend', this.bubble(temp));
    box.scrollTop = box.scrollHeight;

    try {
      const { error } = await state.sb.from('messages').insert({
        sender_id: state.user.id,
        receiver_id: state.activeChat.id,
        sender_name: state.profile.name,
        content,
        priority: 'normal'
      });
      if (error) throw error;
      loadPreviews();
    } catch (e) {
      toast(`Gagal: ${e.message}`, 'err');
    }
  },

  async uploadFile(file) {
    if (!state.activeChat) return toast('Buka chat dulu', 'err');
    if (file.size > 10 * 1048576) return toast('File terlalu besar (max 10 MB)', 'err');

    const ext = file.name.split('.').pop() || 'bin';
    const path = `${state.user.id}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;

    toast('Mengunggah...', 'inf');

    try {
      const { error: upErr } = await state.sb.storage.from('chat-files').upload(path, file, {
        cacheControl: '3600',
        upsert: false
      });
      if (upErr) throw upErr;

      const { data: urlData } = state.sb.storage.from('chat-files').getPublicUrl(path);
      const url = urlData.publicUrl;

      Sound.play('send');
      const temp = {
        id: `t_${Date.now()}`,
        sender_id: state.user.id,
        receiver_id: state.activeChat.id,
        content: '[File]',
        created_at: new Date().toISOString()
      };

      const box = $('msgs');
      if (box.querySelector('div[style*="Belum ada pesan"]')) box.innerHTML = '';
      box.insertAdjacentHTML('beforeend', this.bubble(temp));
      box.scrollTop = box.scrollHeight;

      const { error } = await state.sb.from('messages').insert({
        sender_id: state.user.id,
        receiver_id: state.activeChat.id,
        sender_name: state.profile.name,
        content: `[File] ${file.name}`,
        priority: 'normal',
        media_url: url,
        media_type: file.type,
        media_name: file.name,
        media_size: file.size
      });
      if (error) throw error;

      loadPreviews();
      toast('File terkirim', 'ok');
    } catch (e) {
      toast(`Gagal: ${e.message}`, 'err');
    }
  }
};

// ─── composer (new announcement) ───────────────────────

const composer = {
  open() {
    modal.open({
      html: `
        <div class="modal-title">Buat Pengumuman</div>
        <div class="modal-text">Pengumuman akan tampil di feed semua anggota.</div>
        <input class="modal-input" id="cmp-title" placeholder="Judul (opsional)" maxlength="100">
        <textarea class="modal-input" id="cmp-content" placeholder="Tulis isi pengumuman..." rows="5" maxlength="2000"></textarea>
        <div class="check-row" id="cmp-urgent-row" role="checkbox" aria-checked="false" tabindex="0">
          <div class="check-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div style="flex:1">
            <div class="check-lbl">Tandai Penting</div>
            <div class="check-hint">Muncul di tab "Penting" dengan badge merah</div>
          </div>
        </div>
        <div class="modal-acts">
          <button class="modal-btn cancel" data-close>Batal</button>
          <button class="modal-btn primary" data-submit>Sebarkan</button>
        </div>`,
      onMount: (el) => {
        const urgentRow = el.querySelector('#cmp-urgent-row');
        const toggleUrgent = () => {
          const isChecked = urgentRow.classList.toggle('checked');
          urgentRow.setAttribute('aria-checked', isChecked ? 'true' : 'false');
        };

        urgentRow.addEventListener('click', toggleUrgent);
        urgentRow.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            toggleUrgent();
          }
        });

        el.querySelector('[data-close]').addEventListener('click', () => modal.close());

        el.querySelector('[data-submit]').addEventListener('click', async () => {
          const title = el.querySelector('#cmp-title').value.trim();
          const content = el.querySelector('#cmp-content').value.trim();
          const urgent = urgentRow.classList.contains('checked');

          if (content.length < 5) return toast('Isi terlalu pendek', 'err');

          try {
            const { error } = await state.sb.from('messages').insert({
              sender_id: state.user.id,
              receiver_id: state.user.id,
              sender_name: state.profile.name,
              content,
              title: title || null,
              priority: urgent ? 'urgent' : 'announcement',
              is_pinned: true,
              reads: [state.user.id]
            });
            if (error) throw error;

            modal.close();
            toast('Pengumuman terkirim', 'ok');
            await loadFeed();
            nav.go('feed');
          } catch (e) {
            toast(`Gagal: ${e.message}`, 'err');
          }
        });
      }
    });
  }
};

// ─── profile modal ─────────────────────────────────────

const profilePanel = {
  open() {
    const p = state.profile;
    let pickedFromCamera = false;

    modal.open({
      html: `
        <div style="text-align:center;margin-bottom:20px">
          <div class="avatar-picker" id="pr-picker" role="button" aria-label="Ubah foto profil" tabindex="0">
            <img id="pr-prev" src="${escapeHtml(p.avatar || avatarFor(p.name))}" onerror="this.src='${avatarFor(p.name)}'">
            <div class="avatar-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </div>
          </div>
          <div style="font-size:20px;font-weight:800;color:var(--text)" id="pr-name-display">${escapeHtml(p.name)}</div>
          <div style="font-size:13px;color:var(--text-3);font-family:monospace;margin-top:6px">${p.phone ? `+${p.phone}` : (p.email || '')}</div>
        </div>
        <input class="modal-input" id="pr-name" value="${escapeHtml(p.name)}" placeholder="Nama" maxlength="50">
        <input class="modal-input" id="pr-bio" value="${escapeHtml(p.bio || '')}" placeholder="Bio / status" maxlength="120">
        <div class="modal-acts" style="justify-content:space-between">
          <button class="modal-btn danger" data-logout>Keluar</button>
          <div style="display:flex;gap:8px">
            <button class="modal-btn cancel" data-close>Batal</button>
            <button class="modal-btn primary" data-save>Simpan</button>
          </div>
        </div>`,
      onMount: (el) => {
        const nameInput = el.querySelector('#pr-name');
        const bioInput = el.querySelector('#pr-bio');
        const preview = el.querySelector('#pr-prev');
        const picker = el.querySelector('#pr-picker');
        const nameDisplay = el.querySelector('#pr-name-display');
        const avatarInput = $('avatar-input');

        // Live nama di header modal
        nameInput.addEventListener('input', () => {
          nameDisplay.textContent = nameInput.value || '-';
        });

        // Buka menu pilih sumber (kamera / album)
        const openPickerMenu = () => {
          const existing = document.querySelector('.attach-menu.avatar-menu');
          if (existing) return existing.remove();

          const menu = document.createElement('div');
          menu.className = 'attach-menu avatar-menu';
          menu.style.bottom = 'auto';
          menu.style.top = '50%';
          menu.style.left = '50%';
          menu.style.transform = 'translate(-50%, -50%)';
          menu.style.position = 'fixed';
          menu.style.minWidth = '230px';
          menu.innerHTML = `
            <div class="att-item" data-src="camera">
              <div class="att-ic video">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              </div>
              <div class="att-lbl">Ambil dari Kamera</div>
            </div>
            <div class="att-item" data-src="gallery">
              <div class="att-ic foto">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              </div>
              <div class="att-lbl">Pilih dari Album</div>
            </div>`;

          document.body.appendChild(menu);

          menu.querySelectorAll('[data-src]').forEach((item) => {
            item.addEventListener('click', () => {
              const src = item.dataset.src;
              menu.remove();
              avatarInput.value = '';
              if (src === 'camera') {
                avatarInput.setAttribute('capture', 'user');
                pickedFromCamera = true;
              } else {
                avatarInput.removeAttribute('capture');
                pickedFromCamera = false;
              }
              avatarInput.click();
            });
          });

          setTimeout(() => {
            const closeMenu = (e) => {
              if (!menu.contains(e.target)) menu.remove();
            };
            document.addEventListener('click', closeMenu, { once: true });
          }, 10);
        };

        picker.addEventListener('click', openPickerMenu);
        picker.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openPickerMenu();
          }
        });

        // Handle file yang dipilih
        avatarInput.onchange = async (e) => {
          const file = e.target.files?.[0];
          e.target.value = '';
          avatarInput.removeAttribute('capture');
          if (!file) return;

          if (!file.type.startsWith('image/')) {
            return toast('Hanya file gambar yang didukung', 'err');
          }
          if (file.size > 5 * 1048576) {
            return toast('Foto terlalu besar (max 5 MB)', 'err');
          }

          // Preview lokal (instant feedback)
          const reader = new FileReader();
          reader.onload = (ev) => { preview.src = ev.target.result; };
          reader.readAsDataURL(file);

          // Overlay loading
          const loading = document.createElement('div');
          loading.className = 'avatar-loading';
          loading.textContent = 'Mengunggah...';
          picker.appendChild(loading);

          try {
            const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
            const path = `avatars/${state.user.id}_${Date.now()}.${ext}`;

            const { error: upErr } = await state.sb.storage
              .from('chat-files')
              .upload(path, file, { cacheControl: '3600', upsert: true });
            if (upErr) throw upErr;

            const { data: urlData } = state.sb.storage.from('chat-files').getPublicUrl(path);
            preview.src = urlData.publicUrl;
            preview.dataset.uploadedUrl = urlData.publicUrl;
            toast('Foto siap disimpan', 'ok');
          } catch (err) {
            toast(`Upload gagal: ${err.message}`, 'err');
            preview.src = p.avatar || avatarFor(p.name);
          } finally {
            loading.remove();
          }
        };

        el.querySelector('[data-close]').addEventListener('click', () => modal.close());

        el.querySelector('[data-save]').addEventListener('click', async () => {
          const name = nameInput.value.trim();
          const bio = bioInput.value.trim();
          const newAvatar = preview.dataset.uploadedUrl || p.avatar || avatarFor(name);

          if (name.length < 2) return toast('Nama minimal 2 karakter', 'err');

          try {
            const { error } = await state.sb
              .from('profiles')
              .update({ name, bio, avatar: newAvatar })
              .eq('id', state.user.id);
            if (error) throw error;

            Object.assign(state.profile, { name, bio, avatar: newAvatar });
            modal.close();
            app.syncHeader();
            toast('Profil diperbarui', 'ok');
          } catch (e) {
            toast(`Gagal: ${e.message}`, 'err');
          }
        });

        el.querySelector('[data-logout]').addEventListener('click', async () => {
          modal.close();
          try {
            await state.sb
              .from('profiles')
              .update({ status: 'offline', last_seen: new Date().toISOString() })
              .eq('id', state.user.id);
            await state.sb.auth.signOut();
          } catch (e) {
            // silent
          }
          location.reload();
        });
      }
    });
  }
};

// ─── modal helper ──────────────────────────────────────

const modal = {
  current: null,

  open({ html, onMount }) {
    this.close();
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal">${html}</div>`;
    bg.addEventListener('click', (e) => {
      if (e.target === bg) this.close();
    });
    $('modal-root').appendChild(bg);
    this.current = bg;
    onMount?.(bg.querySelector('.modal'));
  },

  close() {
    if (this.current) {
      this.current.remove();
      this.current = null;
    }
  },

  confirm({ title, text, confirmLabel = 'OK', danger, onConfirm }) {
    this.open({
      html: `
        <div class="modal-title">${escapeHtml(title)}</div>
        <div class="modal-text">${escapeHtml(text)}</div>
        <div class="modal-acts">
          <button class="modal-btn cancel" data-close>Batal</button>
          <button class="modal-btn ${danger ? 'danger' : 'primary'}" data-confirm>${escapeHtml(confirmLabel)}</button>
        </div>`,
      onMount: (el) => {
        el.querySelector('[data-close]').addEventListener('click', () => this.close());
        el.querySelector('[data-confirm]').addEventListener('click', () => {
          this.close();
          onConfirm?.();
        });
      }
    });
  }
};

// ─── data loaders ──────────────────────────────────────

async function loadFeed() {
  try {
    const { data, error } = await state.sb
      .from('messages')
      .select('*')
      .or('priority.eq.announcement,priority.eq.urgent,priority.eq.important,is_pinned.eq.true')
      .order('created_at', { ascending: false })
      .limit(100);
    if (error) throw error;

    state.feed = data || [];
    state.urgent = state.feed.filter((m) => m.priority === 'urgent' || m.priority === 'important');
    app.syncBadges();
  } catch (e) {
    state.feed = [];
    state.urgent = [];
  }
}

async function loadProfiles() {
  try {
    const { data, error } = await state.sb.from('profiles').select('*').order('name');
    if (error) throw error;
    state.profiles = (data || []).filter((p) => p.id !== state.user.id);
    await loadPreviews();
  } catch (e) {
    // leave state.profiles as-is
  }
}

async function loadPreviews() {
  state.previews = {};
  // TODO: batch this in one query via RPC instead of N+1
  for (const p of state.profiles) {
    try {
      const { data } = await state.sb
        .from('messages')
        .select('*')
        .or(`and(sender_id.eq.${state.user.id},receiver_id.eq.${p.id}),and(sender_id.eq.${p.id},receiver_id.eq.${state.user.id})`)
        .order('created_at', { ascending: false })
        .limit(1);
      if (data?.[0]) state.previews[p.id] = data[0];
    } catch (e) {
      // skip failed preview
    }
  }
}

// ─── realtime ──────────────────────────────────────────

function subscribeRealtime() {
  if (state.channel) {
    try { state.sb.removeChannel(state.channel); } catch (e) { /* ignore */ }
  }

  state.channel = state.sb
    .channel(`rt_${state.user.id}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
      const m = payload.new;
      if (!m) return;

      if (state.activeChat && m.sender_id === state.activeChat.id && m.receiver_id === state.user.id) {
        const box = $('msgs');
        if (box) {
          if (box.querySelector('div[style*="Belum ada pesan"]')) box.innerHTML = '';
          box.insertAdjacentHTML('beforeend', roomView.bubble(m));
          setTimeout(() => { box.scrollTop = box.scrollHeight; }, 30);
        }
        Sound.play('receive');
        state.unread[state.activeChat.id] = 0;
      } else if (m.receiver_id === state.user.id) {
        state.unread[m.sender_id] = (state.unread[m.sender_id] || 0) + 1;
        Sound.play('receive');
      }

      if (m.priority === 'announcement' || m.priority === 'urgent' || m.priority === 'important' || m.is_pinned) {
        loadFeed().then(() => { if (!state.activeChat) nav.render(); });
      }
      loadPreviews().then(() => {
        if (state.tab === 'chats' && !state.activeChat) chatsView.render();
      });
      app.syncBadges();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' }, (payload) => {
      const p = payload.new;
      if (!p) return;

      const idx = state.profiles.findIndex((x) => x.id === p.id);
      if (idx > -1) state.profiles[idx] = p;

      if (state.tab === 'chats' && !state.activeChat) chatsView.render();

      if (state.activeChat?.id === p.id) {
        state.activeChat = p;
        const el = $('room-status');
        if (el) {
          el.innerHTML = p.status === 'online'
            ? '<span class="dot"></span>Online'
            : `Terakhir dilihat ${timeAgo(p.last_seen || Date.now())}`;
        }
      }
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, (payload) => {
      const m = payload.old;
      if (!m) return;
      const el = document.querySelector(`[data-id="${m.id}"]`);
      if (el) {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 200);
      }
    })
    .subscribe();
}

// ─── app shell ─────────────────────────────────────────

const app = {
  syncHeader() {
    if (!state.profile) return;
    $('hdr-avatar').src = state.profile.avatar || avatarFor(state.profile.name);
    $('hdr-title').textContent = 'HubKita';
    $('hdr-sub').textContent = `Halo, ${state.profile.name.split(' ')[0]}`;
  },

  syncBadges() {
    const unreadFeed = state.feed.filter((m) => !m.reads?.includes(state.user.id)).length;
    const bf = $('cnt-feed');
    if (unreadFeed > 0) {
      bf.textContent = unreadFeed > 99 ? '99+' : unreadFeed;
      bf.classList.remove('hide');
    } else bf.classList.add('hide');

    const bu = $('cnt-urgent');
    if (state.urgent.length > 0) {
      bu.textContent = state.urgent.length > 99 ? '99+' : state.urgent.length;
      bu.classList.remove('hide');
    } else bu.classList.add('hide');

    const totalUnread = Object.values(state.unread).reduce((a, b) => a + b, 0);
    const bc = $('cnt-chats');
    if (totalUnread > 0) {
      bc.textContent = totalUnread > 99 ? '99+' : totalUnread;
      bc.classList.remove('hide');
    } else bc.classList.add('hide');
  },

  bindGlobal() {
    $('btn-theme').addEventListener('click', () => Theme.toggle());
    $('btn-profile').addEventListener('click', () => profilePanel.open());
    $('fab').addEventListener('click', () => composer.open());

    $('tabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (tab) nav.go(tab.dataset.tab);
    });

    $('content').addEventListener('click', (e) => {
      const action = e.target.closest('[data-action]');
      if (action) {
        const { action: name, id } = action.dataset;
        if (name === 'open-room') roomView.open(id);
        else if (name === 'close-room') roomView.close();
        else if (name === 'mark-read') feedView.markRead(id);
        else if (name === 'delete-message') feedView.confirmDelete(id);
        else if (name === 'delete-chat-message') roomView.confirmDelete(id);
        else if (name === 'open-attach') roomView.openAttach();
        else if (name === 'send-message') roomView.send();
        return;
      }

      const bwrap = e.target.closest('.bwrap');
      if (bwrap && !e.target.closest('.b-menu')) {
        bwrap.classList.toggle('menu-open');
      }
    });

    $('content').addEventListener('keydown', (e) => {
      if (e.target.id === 'chat-input') {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          roomView.send();
        }
        e.target.style.height = 'auto';
        e.target.style.height = `${Math.min(e.target.scrollHeight, 100)}px`;
      }
    });

    $('content').addEventListener('input', (e) => {
      if (e.target.id === 'chat-input') {
        e.target.style.height = 'auto';
        e.target.style.height = `${Math.min(e.target.scrollHeight, 100)}px`;
      }
    });

    $('file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (file) await roomView.uploadFile(file);
    });

    document.body.addEventListener('click', () => {
      if (state.audio?.state === 'suspended') state.audio.resume();
    }, { once: true });
  }
};

// ─── boot / session ────────────────────────────────────

async function enterApp() {
  $('boot').classList.add('out');
  hide('auth');
  show('app');
  $('app').classList.add('on');

  app.syncHeader();
  await loadFeed();
  await loadProfiles();
  subscribeRealtime();
  nav.go('feed');
  app.syncBadges();
  Sound.init();

  window.addEventListener('beforeunload', () => {
    if (state.user && state.sb) {
      state.sb
        .from('profiles')
        .update({ status: 'offline', last_seen: new Date().toISOString() })
        .eq('id', state.user.id);
    }
  });
}

async function boot() {
  Theme.init();
  auth.bind();
  app.bindGlobal();

  setBootStatus('Menghubungkan...');

  if (!window.supabase) {
    setBootStatus('Gagal memuat Supabase');
    setTimeout(() => {
      $('boot').classList.add('out');
      show('auth');
    }, 800);
    return;
  }

  try {
    state.sb = window.supabase.createClient(SB_URL, SB_KEY);
  } catch (e) {
    setBootStatus('Koneksi gagal');
    setTimeout(() => {
      $('boot').classList.add('out');
      show('auth');
    }, 800);
    return;
  }

  const timeout = setTimeout(() => {
    $('boot').classList.add('out');
    show('auth');
  }, 6000);

  try {
    setBootStatus('Memeriksa sesi...');
    const { data: sessionData } = await state.sb.auth.getSession();
    clearTimeout(timeout);

    const session = sessionData?.session;
    if (session?.user) {
      state.user = session.user;
      const { data: profile } = await state.sb
        .from('profiles')
        .select('*')
        .eq('id', state.user.id)
        .maybeSingle();

      if (profile?.name) {
        state.profile = profile;
        await state.sb
          .from('profiles')
          .update({ status: 'online', last_seen: new Date().toISOString() })
          .eq('id', state.user.id);
        state.profile.status = 'online';
        enterApp();
      } else {
        $('boot').classList.add('out');
        show('auth');
        hide('step1');
        hide('step2');
        show('step3');
        setTimeout(() => $('name-input').focus(), 250);
      }
    } else {
      $('boot').classList.add('out');
      show('auth');
    }
  } catch (e) {
    clearTimeout(timeout);
    $('boot').classList.add('out');
    show('auth');
  }

  state.sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session?.user && !state.user) {
      state.user = session.user;
      const { data: profile } = await state.sb
        .from('profiles')
        .select('*')
        .eq('id', state.user.id)
        .maybeSingle();

      if (profile?.name) {
        state.profile = profile;
        await state.sb
          .from('profiles')
          .update({ status: 'online', last_seen: new Date().toISOString() })
          .eq('id', state.user.id);
        state.profile.status = 'online';
        enterApp();
      } else {
        hide('step1');
        hide('step2');
        show('step3');
        setTimeout(() => $('name-input').focus(), 250);
      }
    } else if (event === 'SIGNED_OUT') {
      state.user = null;
      state.profile = null;
      $('app').classList.remove('on');
      show('auth');
      hide('step2');
      hide('step3');
      show('step1');
    }
  });
}

boot();
</script>
